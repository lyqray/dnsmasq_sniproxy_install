# ======================
# dnsmasq_client配置（用于非解锁机，进行DNS管理或分流DNS解析）
# ======================
# （注意：/etc/resolv.conf 需改成 nameserver 127.0.0.1）

# ======================
# 基础参数
# ======================
domain-needed
bogus-priv
no-resolv
no-poll
all-servers  # 并发模式
#strict-order  # 顺序模式
cache-size=2048
local-ttl=60
listen-address=127.0.0.1
listen-address=::1
interface=*
# ======================
# 默认DNS（用于默认解析）
# ======================
server=8.8.8.8
server=1.1.1.1
server=208.67.222.222
server=4.2.2.1

# ======================
# 流媒体域名分流（需分流的域名用后面的IP解析）
